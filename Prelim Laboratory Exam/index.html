<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Student Performance Dashboard">
    <title>Student Performance Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header class="hero">
            <div>
                <p class="eyebrow">Prelim Laboratory Examination</p>
                <h1>Student Performance Dashboard</h1>
                <p class="subtitle">Search, filter, and analyze student academic performance.</p>
            </div>
            <div class="hero-badge">JavaScript ES Modules</div>
        </header>

        <section class="controls card" aria-label="Student filters">
            <div class="control-group search-group">
                <label for="searchInput">Search Student</label>
                <input id="searchInput" type="search" placeholder="Enter student name" autocomplete="off">
            </div>

            <div class="control-group">
                <label for="blockFilter">Block</label>
                <select id="blockFilter">
                    <option value="All">All</option>
                    <option value="31-ITE-01">31-ITE-01</option>
                    <option value="31-ITE-02">31-ITE-02</option>
                    <option value="31-ITE-03">31-ITE-03</option>
                </select>
            </div>

            <div class="control-group">
                <label for="statusFilter">Academic Status</label>
                <select id="statusFilter">
                    <option value="All">All</option>
                    <option value="Excellent">Excellent</option>
                    <option value="Passed">Passed</option>
                    <option value="Needs Improvement">Needs Improvement</option>
                    <option value="Failed">Failed</option>
                </select>
            </div>

            <div class="button-group">
                <button id="applyBtn" class="btn btn-primary" type="button">Apply Filters</button>
                <button id="resetBtn" class="btn btn-secondary" type="button">Reset</button>
            </div>
        </section>

        <section class="summary-grid" aria-label="Class summary">
            <article class="summary-card">
                <span class="summary-label">Class Average</span>
                <strong id="classAverage">0.00</strong>
            </article>
            <article class="summary-card">
                <span class="summary-label">Passing Students</span>
                <strong id="passingCount">0</strong>
            </article>
            <article class="summary-card">
                <span class="summary-label">Displayed Students</span>
                <strong id="displayedCount">0</strong>
            </article>
            <article class="summary-card">
                <span class="summary-label">Top Student</span>
                <strong id="topStudent">—</strong>
            </article>
        </section>

        <div id="messageArea" class="message-area" role="status" aria-live="polite"></div>

        <section>
            <div class="section-heading">
                <div>
                    <h2>Student Records</h2>
                    <p>Final grade = Quiz 25% + Laboratory 35% + Prelim Exam 40%</p>
                </div>
            </div>
            <div id="studentList" class="student-list"></div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
